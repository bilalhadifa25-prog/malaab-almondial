roke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"5\" y=\"3\" width=\"14\" height=\"18\" rx=\"2.5\"><\/rect><circle cx=\"12\" cy=\"10\" r=\"3\"><\/circle><path d=\"M8.5 17c.8-1.6 2-2.4 3.5-2.4s2.7.8 3.5 2.4\"><\/path><\/svg>اللاعبون<\/a>\n    <a href=\"Login.dc.html\" style=\"flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 6px; color: #A3B5A8; text-decoration: none; font-size: 11px\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"4\"><\/circle><path d=\"M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6\"><\/path><\/svg>حسابي<\/a>\n  <\/nav>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  renderVals() {\n    const _st = window.MStore;\n    const _seen = _st ? _st.get('notesSeen', 0) : 0;\n    const _notes = _st ? _st.get('notes', []) : [];\n    const _role = _st && _st.get('session', null) ? _st.get('session', null).role : 'fan';\n    const unread = _st ? _notes.filter((n) => n.id > _seen && (_role !== 'fan' || n.aud === 'all')).length : 1;\n    const tag = (kind) => {\n      if (kind === 'live') return { tagBg: '#1F4A31', tagInk: '#8FE0A8' };\n      if (kind === 'fixed') return { tagBg: '#2A2A1A', tagInk: '#E2C677' };\n      if (kind === 'cup') return { tagBg: '#1E2E45', tagInk: '#A9C4F0' };\n      if (kind === 'free') return { tagBg: '#1B2A21', tagInk: '#A3B5A8' };\n      return { tagBg: '#1B2A21', tagInk: '#C9D6CC' };\n    };\n    const raw = [\n      { time: '6:00', teams: 'البوطيف × الفرسان', tag: 'مباشر', kind: 'live' },\n      { time: '7:00', teams: 'الزللي × حي الرضا', tag: 'دوري المونديال', kind: 'cup' },\n      { time: '9:00', teams: 'البونافع × الزريجة', tag: 'دوري المونديال', kind: 'cup' },\n      { time: '10:00', teams: 'البوعرنوس × الاسواق', tag: 'كأس الشتاء', kind: 'cup' }\n    ];\n    const games = raw.map((g) => ({\n      ...g, ...tag(g.kind),\n      timeColor: g.kind === 'live' ? '#8FE0A8' : '#ECF1EA',\n      textColor: g.kind === 'free' ? '#7F9386' : '#ECF1EA'\n    }));\n    return {\n      unread, hasUnread: unread > 0,\n      games,\n      table: [\n        { pos: 1, name: 'البوطيف', gd: '+9', pts: 12 },\n        { pos: 2, name: 'شباب الوردية', gd: '+6', pts: 10 },\n        { pos: 3, name: 'الفرسان', gd: '+2', pts: 7 },\n        { pos: 4, name: 'الزللي', gd: '0', pts: 6 }\n      ],\n      scorers: [\n        { name: 'علي جبار', team: 'البوطيف', goals: 9 },\n        { name: 'كرار عباس', team: 'شباب الوردية', goals: 7 },\n        { name: 'مصطفى حيدر', team: 'الفرسان', goals: 6 },\n        { name: 'حسين كاظم', team: 'الزللي', goals: 5 }\n      ]\n    };\n  }\n}\n"}, {"name": "Login", "w": 390, "h": 844, "fill": false, "css": "\nbody{margin:0;background:#0D1712}\na{color:#D8B45C}a:hover{color:#E9CB80}\n.p{transition:transform 160ms cubic-bezier(.23,1,.32,1)}\n.p:active{transform:scale(.97)}\n@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}\n.in{animation:rise 360ms cubic-bezier(.23,1,.32,1) both}\ninput::placeholder{color:#7F9386}\ninput:focus{outline:2px solid #D8B45C;outline-offset:2px}\n@media (prefers-reduced-motion:reduce){.in{animation:none}.p{transition:none}}\n", "tpl": "\n<div dir=\"rtl\" style=\"width: 390px; height: 844px; background: #0D1712; color: #ECF1EA; font-family: 'Readex Pro', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative\">\n\n  <svg width=\"390\" height=\"420\" viewBox=\"0 0 390 420\" fill=\"none\" stroke=\"#ECF1EA\" stroke-opacity=\"0.07\" stroke-width=\"2\" style=\"position: absolute; top: 0; left: 0\" aria-hidden=\"true\"><rect x=\"-20\" y=\"-20\" width=\"430\" height=\"420\"><\/rect><path d=\"M-20 200h430\"><\/path><circle cx=\"195\" cy=\"200\" r=\"78\"><\/circle><circle cx=\"195\" cy=\"200\" r=\"3\" fill=\"#ECF1EA\" fill-opacity=\"0.12\"><\/circle><rect x=\"95\" y=\"-20\" width=\"2 ay: {{r.delay}}\">\n            <span style=\"font-size: 13px; color: #A3B5A8\">{{r.label}}<\/span>\n            <span style=\"font-size: {{r.size}}; font-weight: 700; line-height: 1; color: #D8B45C; font-variant-numeric: tabular-nums\">{{r.value}}<\/span>\n            <span style=\"font-size: 15px; font-weight: 600\">{{r.who}}<\/span>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n    <\/sc-if>\n  <\/main>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(props) { super(props); this.state = { tab: 'champs' }; }\n  renderVals() {\n    const tab = this.state.tab;\n    const tabs = [{ id: 'champs', label: 'الأبطال' }, { id: 'records', label: 'الأرقام القياسية' }].map((t) => ({\n      ...t, sel: t.id === tab ? 'true' : 'false', bg: t.id === tab ? '#D8B45C' : 'transparent', ink: t.id === tab ? '#1A1405' : '#A3B5A8', pick: () => this.setState({ tab: t.id }) }));\n    const champs = [\n      ['البوطيف', 'كأس المغلوب · رمضان', '2026'],\n      ['شباب الوردية', 'دوري المونديال · الموسم الأول', '2026'],\n      ['الفرسان', 'كأس الشتاء', '2025'],\n      ['الزللي', 'كأس المغلوب · الصيف', '2025'],\n      ['البوطيف', 'دوري الافتتاح', '2025']\n    ].map((c, i) => ({ team: c[0], cup: c[1], when: c[2], delay: (i * 60) + 'ms', bg: i === 0 ? '#D8B45C' : '#142019', ink: i === 0 ? '#1A1405' : '#ECF1EA' }));\n    const records = [\n      { label: 'الهدّاف التاريخي للملعب', value: '41', who: 'علي جبار · البوطيف', span: 'span 2', size: '56px' },\n      { label: 'أكبر فوز', value: '9–0', who: 'البوطيف × الساده', span: 'auto', size: '34px' },\n      { label: 'أكثر رجل مباراة', value: '11', who: 'كرار عباس', span: 'auto', size: '34px' },\n      { label: 'أكثر فريق حضوراً', value: '64', who: 'شباب الوردية · مباراة', span: 'auto', size: '34px' },\n      { label: 'أكثر الألقاب', value: '2', who: 'البوطيف', span: 'auto', size: '34px' },\n      { label: 'أسرع هدف', value: '0:09', who: 'مصطفى حيدر', span: 'span 2', size: '34px' }\n    ].map((r, i) => ({ ...r, delay: (i * 60) + 'ms' }));\n    return { tabs, champs, records, isChamps: tab === 'champs', isRecords: tab === 'records' };\n  }\n}\n"}, {"name": "Admin", "w": 390, "h": 844, "fill": false, "css": "\nbody{margin:0;background:#0D1712}\na{color:#D8B45C}a:hover{color:#E9CB80}\n.p{transition:transform 160ms cubic-bezier(.23,1,.32,1)}\n.p:active{transform:scale(.97)}\n@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}\n.in{animation:rise 320ms cubic-bezier(.23,1,.32,1) both}\n@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}\n.sheet{animation:sheet 340ms cubic-bezier(.32,.72,0,1) both}\n@keyframes fade{from{opacity:0}to{opacity:1}}\n.scrim{animation:fade 240ms ease both}\n.sc::-webkit-scrollbar{display:none}\ninput::placeholder,textarea::placeholder{color:#7F9386}\ninput:focus,textarea:focus{outline:2px solid #D8B45C;outline-offset:2px}\n@media (prefers-reduced-motion:reduce){.in,.sheet,.scrim{animation:none}.p{transition:none}}\n", "tpl": "\n<div dir=\"rtl\" style=\"width: 390px; height: 844px; background: #0D1712; color: #ECF1EA; font-family: 'Readex Pro', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative\">\n\n  <header style=\"display: flex; align-items: center; gap: 12px; padding: 20px 20px 10px\">\n    <div style=\"width: 44px; height: 44px; border-radius: 50%; background: #D8B45C; color: #1A1405; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700\">شعار<\/div>\n    <div style=\"flex: 1; display: flex; flex-direction: column; gap: 2px\">\n      <span style=\"font-size: 20px; font-weight: 700\">لوحة الإدارة<\/span>\n      <span style=\"font-size: 13px; color: #A3B5A8\">مرحباً، مدير الملعب<\/span>\n    <\/div>\n    <a href=\"Login.dc.html\" onClick=\"{{logout}}\" style=\"font-size: 14px; text-decoration: none; padding: 12px 4px; color: #A3B5A8\">خروج<\/a>\n  <\/header>\n\n  <main class=\"sc\" style=\"flex: 1; overflow-y: auto; font-weight: 700\">بطولة جديدة<\/h2>\n      <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600\">اسم البطولة\n        <input type=\"text\" placeholder=\"مثلاً: كأس الربيع\" style=\"min-height: 50px; border: 0; border-radius: 14px; background: #1B2A21; color: #ECF1EA; font-family: inherit; font-size: 16px; padding: 0 16px\">\n      <\/label>\n      <div style=\"display: flex; flex-direction: column; gap: 6px\">\n        <sc-for list=\"{{formats}}\" as=\"f\" hint-placeholder-count=\"3\">\n          <button onClick=\"{{f.pick}}\" aria-pressed=\"{{f.sel}}\" class=\"p\" style=\"border: 0; border-radius: 16px; padding: 12px 14px; font-family: inherit; text-align: right; cursor: pointer; display: flex; flex-direction: column; gap: 2px; background: {{f.bg}}; color: {{f.ink}}\">\n            <span style=\"font-size: 15px; font-weight: 700\">{{f.label}}<\/span>\n            <span style=\"font-size: 12px; opacity: 0.85\">{{f.desc}}<\/span>\n          <\/button>\n        <\/sc-for>\n      <\/div>\n      <div style=\"display: flex; align-items: center; justify-content: space-between\">\n        <span style=\"font-size: 15px; font-weight: 600\">عدد الفرق<\/span>\n        <div style=\"display: flex; align-items: center; gap: 6px\">\n          <button onClick=\"{{minus}}\" aria-label=\"أقل\" class=\"p\" style=\"width: 44px; height: 44px; border: 0; border-radius: 12px; background: #1B2A21; color: #ECF1EA; font-size: 22px; cursor: pointer\">−<\/button>\n          <span style=\"width: 40px; text-align: center; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums\">{{teams}}<\/span>\n          <button onClick=\"{{plus}}\" aria-label=\"أكثر\" class=\"p\" style=\"width: 44px; height: 44px; border: 0; border-radius: 12px; background: #1B2A21; color: #ECF1EA; font-size: 22px; cursor: pointer\">+<\/button>\n        <\/div>\n      <\/div>\n      <button onClick=\"{{create}}\" class=\"p\" style=\"min-height: 54px; border: 0; border-radius: 999px; background: #D8B45C; color: #1A1405; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer\">إنشاء وتوليد الجدول تلقائياً<\/button>\n    <\/div>\n  <\/sc-if>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { aud: 'all', msg: 'بدأت الآن مباراة البوطيف والفرسان. تابعوا النتيجة مباشرة.', toast: '', sheet: false, fmt: 'groups', teams: 16 };\n  }\n  flash(text) { this.setState({ toast: text }); setTimeout(() => this.setState({ toast: '' }), 2600); }\n  renderVals() {\n    const s = this.state;\n    const A = [{ id: 'all', label: 'الجميع' }, { id: 'caps', label: 'الكباتن' }, { id: 'team', label: 'فريق محدد' }, { id: 'cup', label: 'فرق بطولة' }];\n    const audiences = A.map((a) => ({ ...a, sel: a.id === s.aud ? 'true' : 'false', bg: a.id === s.aud ? '#ECF1EA' : '#1B2A21', ink: a.id === s.aud ? '#0D1712' : '#A3B5A8', pick: () => this.setState({ aud: a.id }) }));\n    const T = [\n      { label: 'بدأت المباراة', msg: 'بدأت الآن مباراة البوطيف والفرسان. تابعوا النتيجة مباشرة.' },\n      { label: 'هدف', msg: 'هدف للصقور! علي جبار يسجّل في الدقيقة 27.' },\n      { label: 'نتيجة القرعة', msg: 'ظهرت قرعة كأس الشتاء. شاهدوا مجموعتكم الآن.' },\n      { label: 'تغيير موعد', msg: 'تنبيه: تأجّلت مباراة الساعة 9 إلى الساعة 10 مساءً.' }\n    ];\n    const templates = T.map((t) => ({ label: t.label, pick: () => { this.typed = null; this.setState({ msg: t.msg }); } }));\n    const audLabel = (A.find((a) => a.id === s.aud) || A[0]).label;\n    const F = [\n      { id: 'league', label: 'دوري', desc: 'الكل يلعب ضد الكل، والترتيب بالنقاط' },\n      { id: 'ko', label: 'خروج المغلوب', desc: 'شجرة إقصاء مع ركلات ترجيح عند التعادل' },\n      { id: 'groups', label: 'كأس بالمجموعات', desc: 'مجموعات ثم ربع ونصف ونهائي' }\n    ];\n    const formats = F.map((f) => ({ ...f, sel: f.id === s.fmt ? 'true' : 'false', bg: f.id === s.fmt ? '#D8B45C' : '#1B2A21', ink: f.id === s.fmt ? '#1A1405' : '#ECF1EA', pick: () => this.setState({ fmt: f.id }) }));\n    const remOn = s.rem !== false;\n    return {\n      logout: () => { if (window.MStore) window.MStore.set('session', null); },\n      remAria: remOn ? 'true' : 'false', remTrack: remOn ? '#D8B45C' : '#2C3D33', remKnob: remOn ? 'translateX(-20px)' : 'translateX(0)',\n      toggleRem: () => this.setState({ rem: !remOn }),\n      audiences, templates, message: s.msg, audienceLabel: audLabel,\n      setMsg: (e) => { this.typed = e && e.target ? e.target.value : null; },\n      send: () => {\n        const text = ((this.typed != null ? this.typed : s.msg) || '').trim();\n        if (!text) { this.flash('اكتب نص الإشعار أولاً'); return; }\n        const st = window.MStore;\n        if (st) {\n          const notes = st.get('notes', []);\n          const now = new Date();\n          notes.unshift({ id: now.getTime(), text, aud: s.aud, audLabel, at: now.toISOString() });\n          st.set('notes', notes.slice(0, 100));\n        }\n        this.flash('أُرسل الإشعار إلى ' + audLabel + ' ويظهر في جرس التطبيق');\n      },\n      toast: !!s.toast, toastText: s.toast,\n      sheet: s.sheet, formats, teams: s.teams,\n      openNew: () => this.setState({ sheet: true }),\n      closeNew: () => this.setState({ sheet: false }),\n      minus: () => this.setState({ teams: Math.max(4, s.teams - 1) }),\n      plus: () => this.setState({ teams: Math.min(32, s.teams + 1) }),\n      create: () => { this.setState({ sheet: false }); this.flash('أُنشئت البطولة وتولّد جدول المباريات'); }\n    };\n  }\n}\n"}, {"name": "Referee", "w": 390, "h": 844, "fill": false, "css": "\nbody{margin:0;background:#0D1712}\na{color:#D8B45C}a:hover{color:#E9CB80}\n.p{transition:transform 140ms cubic-bezier(.23,1,.32,1)}\n.p:active{transform:scale(.96)}\n@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n.in{animation:rise 260ms cubic-bezier(.23,1,.32,1) both}\n@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.1 s=\"sd\" hint-placeholder-count=\"2\">\n      <div style=\"display: flex; flex-direction: column; gap: 6px\">\n        <sc-for list=\"{{sd.players}}\" as=\"pl\" hint-placeholder-count=\"5\">\n          <button onClick=\"{{pl.tap}}\" disabled=\"{{pl.off}}\" class=\"p\" style=\"min-height: 44px; border: 0; border-radius: 14px; padding: 0 10px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 6px; background: {{pl.bg}}; color: {{pl.ink}}\">\n            <span style=\"white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{pl.num}} · {{pl.name}}<\/span>\n            <span style=\"display: flex; gap: 3px; align-items: center\">\n              <sc-if value=\"{{pl.hasGoals}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size: 12px; color: #8FE0A8; font-variant-numeric: tabular-nums\">{{pl.goals}}×<\/span><\/sc-if>\n              <sc-if value=\"{{pl.y1}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width: 9px; height: 13px; border-radius: 2px; background: #E8C547\"><\/span><\/sc-if>\n              <sc-if value=\"{{pl.y2}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width: 9px; height: 13px; border-radius: 2px; background: #E8C547\"><\/span><\/sc-if>\n              <sc-if value=\"{{pl.r}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width: 9px; height: 13px; border-radius: 2px; background: #E05A4E\"><\/span><\/sc-if>\n            <\/span>\n          <\/button>\n        <\/sc-for>\n      <\/div>\n    <\/sc-for>\n  <\/div>\n\n  <div class=\"sc\" style=\"flex: 1; overflow-y: auto; margin: 10px 20px 0; display: flex; flex-direction: column; gap: 6px\">\n    <sc-if value=\"{{hasAlert}}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"in\" role=\"status\" style=\"background: #3A1E1B; color: #F6C9C3; border-radius: 14px; padding: 10px 12px; font-size: 13px; font-weight: 600\">{{alert}}<\/div>\n    <\/sc-if>\n    <sc-for list=\"{{log}}\" as=\"e\" hint-placeholder-count=\"2\">\n      <div class=\"in\" style=\"font-size: 13px; color: #C9D6CC; background: #142019; border-radius: 12px; padding: 9px 12px\">{{e}}<\/div>\n    <\/sc-for>\n  <\/div>\n\n  <div style=\"padding: 10px 20px 22px; display: flex; gap: 8px\">\n    <button onClick=\"{{undo}}\" class=\"p\" style=\"min-height: 54px; padding: 0 18px; border: 0; border-radius: 999px; background: #1B2A21; color: #ECF1EA; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer\">تراجع<\/button>\n    <button onClick=\"{{finish}}\" class=\"p\" style=\"flex: 1; min-height: 54px; border: 0; border-radius: 999px; background: {{finishBg}}; color: {{finishInk}}; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer\">{{finishLabel}}<\/button>\n  <\/div>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.rosters = {\n      'البوطيف': [['10','علي جبار'],['7','عباس فاضل'],['4','حسين علي'],['9','أحمد كريم'],['1','زيد مهدي']],\n      'الفرسان': [['11','مصطفى حيدر'],['8','كرار حسن'],['5','حيدر عادل'],['6','منتظر جواد'],['1','سجاد ناصر']],\n      'الزللي': [['9','حسين كاظم'],['7','سيف كريم'],['5','محمد رضا'],['3','باقر حسن'],['1','علي فارس']],\n      'حي الرضا': [['10','حيدر سلام'],['8','مهدي صالح'],['4','رسول كاظم'],['6','أمير علي'],['1','جعفر حسين']],\n      'البونافع': [['9','ليث فاضل'],['7','علي رزاق'],['5','حسن مجيد'],['3','نور الدين'],['1','عمار جاسم']],\n      'الزريجة': [['10','سيف علي'],['8','مرتضى حسن'],['6','كرار ناصر'],['4','حمزة علي'],['1','يوسف سالم']]\n    };\n    this.list = [\n      { id: 'm1', a: 'البوطيف', b: 'الفرسان', time: '6:00' },\n      { id: 'm2', a: 'الزللي', b: 'حي الرضا', time: '7:00' },\n      { id: 'm3', a: 'البونافع', b: 'الزريجة', time: '9:00' }\n    ];\n    this.state = { cur: 'm1', mode: 'goal', events: { m1: [], m2: [], m3: [] }, done: {} };\n  }\n  renderVals() {\n    const s = this.state;\n    const m = this.list.find((x) => x.id === s.cur);\n    const ev = s.events[s.cur];\n    const done = !!s.done[s.cur];\n    const count = (t, name, kind) => ev.filter((e) => e.t === t && e.name === name && e.kind === kind).length;\n    const sa = ev.filter((e) => e.t === 'a' && e.kind === 'goal').length;\n    const sb = ev.filter((e) => e.t === 'b' && e.kind === 'goal').length;\n    const matches = this.list.map((x) => {\n      const sel = x.id === s.cur;\n      const st = s.done[x.id] ? 'انتهت' : (s.events[x.id].length ? 'جارية' : 'لم تبدأ');\n      return { label: x.a + ' × ' + x.b, time: x.time, status: st, sel: sel ? 'true' : 'false', bg: sel ? '#D8B45C' : '#142019', ink: sel ? '#1A1405' : '#ECF1EA', pick: () => this.setState({ cur: x.id }) };\n    });\n    const M = [\n      { id: 'goal', label: 'هدف', chip: '#6FCF8E' },\n      { id: 'yellow', label: 'إنذار', chip: '#E8C547' },\n      { id: 'red', label: 'طرد', chip: '#E05A4E' }\n    ];\n    const modes = M.map((x) => ({ ...x, sel: x.id === s.mode ? 'true' : 'false', bg: x.id === s.mode ? '#ECF1EA' : '#142019', ink: x.id === s.mode ? '#0D1712' : '#ECF1EA', pick: () => this.setState({ mode: x.id }) }));\n    let alert = '';\n    const side = (t, team) => ({\n      players: this.rosters[team].map((p) => {\n        const name = p[1];\n        const g = count(t, name, 'goal'), y = count(t, name, 'yellow'), r = count(t, name, 'red');\n        const sentOff = r > 0 || y >= 2;\n        if (y >= 2) alert = name + ': إنذار ثانٍ = طرد، وإيقاف تلقائي للمباراة القادمة';\n        else if (r > 0) alert = name + ': طرد مباشر، وإيقاف تلقائي لمباراتين';\n        return {\n          num: p[0], name, goals: g, hasGoals: g > 0, y1: y >= 1, y2: y >= 2, r: r > 0,\n          off: sentOff || done,\n          bg: sentOff ? '#2A1A18' : (t === 'a' ? '#1E3A2A' : '#1E2A42'),\n          ink: sentOff ? '#9C7C77' : '#ECF1EA',\n          tap: () => {\n            if (sentOff || done) return;\n            const list = this.state.events[this.state.cur];\n            const next = list.concat([{ t, name, kind: this.state.mode, min: 3 + list.length * 4 }]);\n            this.setState({ events: { ...this.state.events, [this.state.cur]: next } });\n          }\n        };\n      })\n    });\n    const kindTxt = { goal: 'هدف', yellow: 'إنذار', red: 'طرد' };\n    const log = ev.slice().reverse().map((e) => e.min + '′  ' + kindTxt[e.kind] + ' — ' + e.name);\n    return {\n      logout: () => { if (window.MStore) window.MStore.set('session', null); },\n      matches, teamA: m.a, teamB: m.b, sa, sb, even: ev.length % 2 === 0, odd: ev.length % 2 === 1,\n      modes, sides: [side('a', m.a), side('b', m.b)],\n      log, alert, hasAlert: !!alert,\n      undo: () => { if (done) { this.setState({ done: { ...s.done, [s.cur]: false } }); return; } this.setState({ events: { ...s.events, [s.cur]: ev.slice(0, -1) } }); },\n      finish: () => this.setState({ done: { ...s.done, [s.cur]: true } }),\n      finishLabel: done ? 'اعتُمدت النتيجة · تحدّث الترتيب' : 'إنهاء المباراة واعتماد النتيجة',\n      finishBg: done ? '#1F4A31' : '#D8B45C', finishInk: done ? '#DDF5E4' : '#1A1405'\n    };\n  }\n}\n"}, {"name": "Team", "w": 390, "h": 844, "fill": false, "css": "\nbody{margin:0;background:#0D1712}\na{color:#D8B45C}a:hover{color:#E9CB80}\n.p{transition:transform 160ms cubic-bezier(.23,1,.32,1)}\n.p:active{transform:scale(.97)}\n@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}\n.in{animation:rise 340ms cubic-bezier(.23,1,.32,1) both}\n@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}\n.sheet{animation:sheet 340ms cubic-bezier(.32,.72,0,1) both}\n@keyframes fade{from{opacity:0}to{opacity:1}}\n.scrim{animation:fade 240ms ease both}\n.sc::-webkit-scrollbar{display:none}\ninput::placeholder{color:#7F9386}\ninput:focus{outline:2px solid #D8B45C;outline-offset:2px}\n@media (prefers-reduced-motion:reduce){.in,.sheet,.scrim{animation:none}.p{transition:none}}\n", "tpl": "\n<div dir=\"rtl\" style=\"width: 390px; height: 8 ckground: #2A2A1A; border-radius: 20px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start\">\n      <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#E2C677\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: 0 0 auto; margin-top: 2px\"><path d=\"M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15zM10 21h4\"><\/path><\/svg>\n      <div style=\"display: flex; flex-direction: column; gap: 4px\">\n        <span style=\"font-size: 15px; font-weight: 700; color: #E2C677\">تذكير بمباراة البطولة<\/span>\n        <span style=\"font-size: 14px; line-height: 1.6; color: #ECF1EA\">مباراتكم ضد الزريجة في دوري المونديال تبدأ {{reminderText}}. جهّزوا الفريق.<\/span>\n      <\/div>\n    <\/div>\n\n    <section style=\"display: flex; flex-direction: column; gap: 8px\">\n      <span style=\"font-size: 14px; font-weight: 600\">موعد تذكيري قبل مباريات البطولة<\/span>\n      <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: #142019; border-radius: 14px; padding: 4px\">\n        <sc-for list=\"{{reminders}}\" as=\"r\" hint-placeholder-count=\"3\">\n          <button onClick=\"{{r.pick}}\" aria-pressed=\"{{r.sel}}\" class=\"p\" style=\"min-height: 44px; border: 0; border-radius: 10px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; background: {{r.bg}}; color: {{r.ink}}\">{{r.label}}<\/button>\n        <\/sc-for>\n      <\/div>\n    <\/section>\n\n    <section style=\"display: flex; flex-direction: column; gap: 8px\">\n      <span style=\"font-size: 14px; font-weight: 600\">لون الفريق في الجداول والبطاقات<\/span>\n      <div style=\"display: flex; gap: 10px\">\n        <sc-for list=\"{{colors}}\" as=\"c\" hint-placeholder-count=\"6\">\n          <button onClick=\"{{c.pick}}\" aria-label=\"{{c.label}}\" aria-pressed=\"{{c.sel}}\" class=\"p\" style=\"width: 44px; height: 44px; border-radius: 50%; border: 3px solid {{c.ring}}; background: {{c.hex}}; cursor: pointer; padding: 0\"><\/button>\n        <\/sc-for>\n      <\/div>\n    <\/section>\n\n    <a href=\"Tournaments.dc.html\" class=\"p\" style=\"text-decoration: none; color: #ECF1EA; background: #142019; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 6px\">\n      <span style=\"font-size: 13px; color: #D8B45C; font-weight: 600\">مباراتكم القادمة · دوري المونديال<\/span>\n      <span style=\"font-size: 19px; font-weight: 700\">شباب الوردية × الزريجة<\/span>\n      <span style=\"font-size: 14px; color: #A3B5A8\">الخميس 12 تشرين الثاني · 8:00 مساءً<\/span>\n    <\/a>\n\n    <section style=\"display: flex; flex-direction: column; gap: 10px\">\n      <div style=\"display: flex; align-items: baseline; justify-content: space-between\">\n        <h2 style=\"margin: 0; font-size: 18px; font-weight: 700\">مباريات البطولات<\/h2>\n        <span style=\"font-size: 12px; color: #A3B5A8\">كل الفرق<\/span>\n      <\/div>\n      <div role=\"tablist\" style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #142019; border-radius: 14px; padding: 4px\">\n        <sc-for list=\"{{mtabs}}\" as=\"t\" hint-placeholder-count=\"2\">\n          <button role=\"tab\" aria-selected=\"{{t.sel}}\" onClick=\"{{t.pick}}\" class=\"p\" style=\"min-height: 42px; border: 0; border-radius: 10px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; background: {{t.bg}}; color: {{t.ink}}\">{{t.label}}<\/button>\n        <\/sc-for>\n      <\/div>\n      <sc-for list=\"{{mlist}}\" as=\"m\" hint-placeholder-count=\"4\">\n        <a href=\"Match.dc.html\" class=\"p in\" style=\"text-decoration: none; color: #ECF1EA; display: flex; align-items: center; gap: 12px; background: {{m.bg}}; border-radius: 16px; padding: 12px 14px\">\n          <div style=\"flex: 1; display: flex; flex-direction: column; gap: 2px\">\n            <span style=\"font-size: 15px; font-weight: 600\">{{m.teams}}<\/span> الترتيب' }, { id: 'results', label: 'النتائج' }, { id: 'next', label: 'القادمة' }, { id: 'scorers', label: 'الهدافون' }]\n      .map((t) => ({ ...t, sel: t.id === tab ? 'true' : 'false', bg: t.id === tab ? '#ECF1EA' : '#142019', ink: t.id === tab ? '#0D1712' : '#A3B5A8', pick: () => this.setState({ tab: t.id }) }));\n    const L = [['البوطيف',5,4,0,1,9],['شباب الوردية',5,3,1,1,6],['الفرسان',5,2,1,2,2],['الزللي',5,2,0,3,0],['حي الرضا',5,1,2,2,-2],['البونافع',5,1,1,3,-4],['الزريجة',5,1,1,3,-5],['الساده',5,1,0,4,-6]];\n    const league = L.map((r, i) => ({ pos: i + 1, name: r[0], p: r[1], w: r[2], d: r[3], l: r[4], gd: r[5] > 0 ? '+' + r[5] : String(r[5]), pts: r[2] * 3 + r[3], posInk: i === 0 ? '#D8B45C' : '#A3B5A8' }));\n    const results = [\n      { when: 'الخميس 5 ت2', teams: 'البوطيف × الساده', score: '3–1' },\n      { when: 'الخميس 5 ت2', teams: 'الزللي × البونافع', score: '2–2' },\n      { when: 'الأربعاء 4 ت2', teams: 'شباب الوردية × الزريجة', score: '4–0' },\n      { when: 'الأربعاء 4 ت2', teams: 'الفرسان × حي الرضا', score: '1–0' }\n    ].map((m) => ({ ...m, ink: '#ECF1EA' }));\n    const next = [\n      { when: 'اليوم 7:00', teams: 'الزللي × حي الرضا', score: '—' },\n      { when: 'الخميس 8:00', teams: 'شباب الوردية × الزريجة', score: '—' },\n      { when: 'الخميس 9:00', teams: 'البونافع × الساده', score: '—' }\n    ].map((m) => ({ ...m, ink: '#A3B5A8' }));\n    return {\n      tabs, league,\n      rows: tab === 'next' ? next : results,\n      scorers: [{ n: 'علي جبار', t: 'البوطيف', g: 9 }, { n: 'كرار عباس', t: 'شباب الوردية', g: 7 }, { n: 'مصطفى حيدر', t: 'الفرسان', g: 6 }, { n: 'حسين كاظم', t: 'الزللي', g: 5 }],\n      isTable: tab === 'table', isList: tab === 'results' || tab === 'next', isScorers: tab === 'scorers'\n    };\n  }\n}\n"}, {"name": "Splash", "w": 390, "h": 844, "fill": false, "css": "\nbody{margin:0;background:#0D1712}\na{color:#D8B45C}a:hover{color:#E9CB80}\n.p{transition:transform 160ms cubic-bezier(.23,1,.32,1)}\n.p:active{transform:sca \">{{i.k}}<\/span>\n            <span style=\"font-size: 15px; font-weight: 600\">{{i.v}}<\/span>\n          <\/div>\n        <\/div>\n      <\/sc-for>\n    <\/section>\n\n    <a href=\"HallOfFame.dc.html\" class=\"p\" style=\"min-height: 52px; border-radius: 999px; background: #D8B45C; color: #1A1405; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; text-decoration: none\">أبطال الملعب عبر المواسم<\/a>\n  <\/main>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      info: [\n        { icon: '7×7', k: 'الملعب', v: 'سباعي · عشب صناعي · إنارة ليلية' },\n        { icon: 'وقت', k: 'أوقات العمل', v: '[من 3 عصراً إلى 1 ليلاً]' },\n        { icon: 'مكان', k: 'العنوان', v: '[عنوان الملعب]' },\n        { icon: 'هاتف', k: 'للتواصل والحجز', v: '[رقم هاتف الإدارة]' }\n      ],\n      back: () => { try { window.history.back(); } catch (e) {} }\n    };\n  }\n}\n"}, {"name": "Inbox", "w": 390, "h": 844, "fill": false, "css": "\nbody{margin:0;background:#0D1712}\na{color:#D8B45C}a:hover{color:#E9CB80}\n.p{transition:transform 160ms cubic-bezier(.23,1,.32,1)}\n.p:active{transform:scale(.97)}\n@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}\n.in{animation:rise 340ms cubic-bezier(.23,1,.32,1) both}\n.sc::-webkit-scrollbar{display:none}\n@media (prefers-reduced-motion:reduce){.in{animation:none}.p{transition:none}}\n", "tpl": "\n<div dir=\"rtl\" style=\"width: 390px; height: 844px; background: #0D1712; color: #ECF1EA; font-family: 'Readex Pro', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden\">\n\n  <header style=\"display: flex; align-items: center; gap: 12px; padding: 16px 20px 12px\">\n    <button onClick=\"{{back}}\" aria-label=\"رجوع\" class=\"p\" style=\"width: 44px; height: 44px; border: 0; border-radius: 50%; background: #1B2A21; color: #ECF1EA; display: flex; align-items: center; justify-content: center; cursor: pointer\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m9 6 6 6-6 6\"><\/path><\/svg><\/button>\n    <div style=\"flex: 1; display: flex; flex-direction: column; gap: 2px\">\n      <h1 style=\"margin: 0; font-size: 22px; font-weight: 700\">الإشعارات<\/h1>\n      <span style=\"font-size: 13px; color: #A3B5A8\">من إدارة ملعب المونديال<\/span>\n    <\/div>\n  <\/header>\n\n  <main class=\"sc\" style=\"flex: 1; overflow-y: auto; padding: 4px 20px 28px; display: flex; flex-direction: column; gap: 8px\">\n    <sc-if value=\"{{empty}}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top: 80px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center\">\n        <svg width=\"56\" height=\"56\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3B5244\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15zM10 21h4\"><\/path><\/svg>\n        <span style=\"font-size: 17px; font-weight: 600\">لا توجد إشعارات بعد<\/span>\n        <span style=\"font-size: 14px; color: #A3B5A8; line-height: 1.6\">عندما ترسل الإدارة إشعاراً، يظهر هنا.<\/span>\n      <\/div>\n    <\/sc-if>\n    <sc-for list=\"{{notes}}\" as=\"n\" hint-placeholder-count=\"3\">\n      <div class=\"in\" style=\"background: {{n.bg}}; border-radius: 18px; padding: 14px 16px; display: flex; gap: 12px; animation-delay: {{n.delay}}\">\n        <span style=\"width: 10px; height: 10px; margin-top: 6px; border-radius: 50%; background: {{n.dot}}; flex: 0 0 auto\"><\/span>\n        <div style=\"flex: 1; display: flex; flex-direction: column; gap: 6px\">\n          <span style=\"font-size: 15px; line-height: 1.7\">{{n.text}}<\/span>\n          <span style=\"font-size: 12px; color: #A3B5A8\">{{n.when}} · إلى {{n.audLabel}}<\/span>\n        <\/div>\n      <\/div>\n    <\/sc-for>\n  <\/main>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const st = window.MStore;\n    this.lastSeen = st ? st.get('notesSeen', 0) : 0;\n  }\n  componentDidMount() {\n    const st = window.MStore;\n    if (st) st.set('notesSeen', Date.now());\n  }\n  renderVals() {\n    const st = window.MStore;\n    const session = st ? st.get('session', null) : null;\n    const role = session ? session.role : 'fan';\n    const sample = [{ id: 1, text: 'أهلاً بكم في تطبيق ملعب المونديال. ستصلكم هنا أخبار المباريات والقرعة.', audLabel: 'الجميع', aud: 'all', at: '2026-11-07T18:00:00Z' }];\n    let all = st ? st.get('notes', null) : null;\n    if (!all || !all.length) all = sample;\n    const visible = all.filter((n) => role !== 'fan' || n.aud === 'all');\n    const fmt = (iso) => {\n      try {\n        const d = new Date(iso);\n        const p = (x) => (x < 10 ? '0' : '') + x;\n        return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate() + ' · ' + p(d.getHours()) + ':' + p(d.getMinutes());\n      } catch (e) { return ''; }\n    };\n    const notes = visible.map((n, i) => {\n      const unread = n.id > this.lastSeen && n.id > 1;\n      return { text: n.text, audLabel: n.audLabel, when: fmt(n.at), delay: (i * 40) + 'ms', bg: unread ? '#1F3326' : '#142019', dot: unread ? '#D8B45C' : '#2C3D33' };\n    });\n    return { notes, empty: notes.length === 0, back: () => { try { window.history.back(); } catch (e) {} } };\n  }\n}\n"}, {"name": "NewCup", "w": 390, "h": 844, "fill": false, "css": "\nbody{margin:0;background:#0D1712}\na{color:#D8B45C}a:hover{color:#E9CB80}\n.p{transition:transform 150ms cubic-bezier(.23,1,.32,1)}\n.p:active{transform:scale(.97)}\n@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}\n.in{animation:rise 340ms cubic-bezier(.23,1,.32,1) both}\n@keyframes land{0%{opacity:0;transform:scale(.85)}100%{opacity:1;transform:none}}\n.land{anima =\"p\" style=\"min-height: 52px; border: 0; border-radius: 14px; padding: 0 12px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; background: {{t.bg}}; color: {{t.ink}}\">\n              <span style=\"width: 20px; height: 20px; border-radius: 6px; border: 2px solid {{t.box}}; background: {{t.fill}}; flex: 0 0 auto\"><\/span>{{t.name}}\n            <\/button>\n          <\/sc-for>\n        <\/div>\n        <sc-if value=\"{{isGroups}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between; background: #142019; border-radius: 16px; padding: 12px 14px\">\n            <span style=\"font-size: 15px; font-weight: 600\">عدد المجموعات<\/span>\n            <div style=\"display: flex; align-items: center; gap: 6px\">\n              <button onClick=\"{{gMinus}}\" aria-label=\"أقل\" class=\"p\" style=\"width: 44px; height: 44px; border: 0; border-radius: 12px; background: #1B2A21; color: #ECF1EA; font-size: 22px; cursor: pointer\">−<\/button>\n              <span style=\"width: 34px; text-align: center; font-size: 20px; font-weight: 700\">{{groupsN}}<\/span>\n              <button onClick=\"{{gPlus}}\" aria-label=\"أكثر\" class=\"p\" style=\"width: 44px; height: 44px; border: 0; border-radius: 12px; background: #1B2A21; color: #ECF1EA; font-size: 22px; cursor: pointer\">+<\/button>\n            <\/div>\n          <\/div>\n          <span style=\"font-size: 13px; color: #A3B5A8\">يتأهل الأول والثاني من كل مجموعة إلى الأدوار الإقصائية.<\/span>\n        <\/sc-if>\n        <sc-if value=\"{{tooFew}}\" hint-placeholder-val=\"{{ false }}\">\n          <span style=\"font-size: 13px; color: #F2A39A\">اختر 4 فرق على الأقل.<\/span>\n        <\/sc-if>\n      <\/div>\n    <\/sc-if>\n\n    <sc-if value=\"{{s3}}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"in\" style=\"display: flex; flex-direction: column; gap: 14px\">\n        <div style=\"background: #142019; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px\">\n          <span style=\"font-size: 19px; font-weight: 700\">{{cupName}}<\/span>\n          <span style=\"font-size: 13px; color: #A3B5A8\">{{fmtLabel}} · {{selCount}} فرق<\/span>\n        <\/div>\n\n        <sc-if value=\"{{showGroups}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px\">\n            <sc-for list=\"{{groups}}\" as=\"g\" hint-placeholder-count=\"2\">\n              <div style=\"background: #142019; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 6px\">\n                <span style=\"font-size: 13px; font-weight: 700; color: #D8B45C\">{{g.name}}<\/span>\n                <sc-for list=\"{{g.slots}}\" as=\"s\" hint-placeholder-count=\"5\">\n                  <div style=\"min-height: 34px; border-radius: 10px; padding: 0 10px; display: flex; align-items: center; font-size: 14px; font-weight: 600; background: {{s.bg}}; color: {{s.ink}}\">\n                    <sc-if value=\"{{s.filled}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"land\">{{s.team}}<\/span><\/sc-if>\n                    <sc-if value=\"{{s.empty}}\" hint-placeholder-val=\"{{ true }}\"><span>—<\/span><\/sc-if>\n                  <\/div>\n                <\/sc-for>\n              <\/div>\n            <\/sc-for>\n          <\/div>\n        <\/sc-if>\n\n        <sc-if value=\"{{showRounds}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 12px\">\n            <sc-for list=\"{{rounds}}\" as=\"r\" hint-placeholder-count=\"2\">\n              <div class=\"in\" style=\"display: flex; flex-direction: column; gap: 6px\">\n                <span style=\"font-size: 14px; font-weight: 700; color: #D8B45C\">{{r.name}}<\/span>\n                <sc-for list=\"{{r.matches}}\" as=\"m\" hint-placeholder-count=\"4\">\n                  <div style=\"background: #142019; border-radius: 14px; padding: 11px 14px; display: flex; align-items: center; gap: 10px; font-size: 14px\">\n                    <span style=\"flex: 1; font-weight: 600; text-align: right\">{{m.a}}<\/span>\n                    <span style=\"font-size: 12px; color: #A3B5A8\">ضد<\/span>\n                    <span style=\"flex: 1; font-weight: 600; text-align: left\">{{m.b}}<\/span>\n                  <\/div>\n                <\/sc-for>\n              <\/div>\n            <\/sc-for>\n          <\/div>\n        <\/sc-if>\n\n        <sc-if value=\"{{saved}}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"in\" role=\"status\" style=\"background: #1F4A31; color: #DDF5E4; border-radius: 16px; padding: 14px 16px; font-size: 15px; font-weight: 600; line-height: 1.6\">حُفظت البطولة وأُرسل إشعار للجميع. تجدها في صفحة البطولات.<\/div>\n        <\/sc-if>\n      <\/div>\n    <\/sc-if>\n  <\/main>\n\n  <div style=\"position: absolute; right: 0; left: 0; bottom: 0; padding: 14px 20px 24px; background: linear-gradient(to bottom, rgba(13,23,18,0), #0D1712 30%); display: flex; gap: 8px\">\n    <sc-if value=\"{{showPrev}}\" hint-placeholder-val=\"{{ false }}\">\n      <button onClick=\"{{prev}}\" class=\"p\" style=\"min-height: 56px; padding: 0 20px; border: 0; border-radius: 999px; background: #1B2A21; color: #ECF1EA; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer\">السابق<\/button>\n    <\/sc-if>\n    <button onClick=\"{{primary}}\" class=\"p\" style=\"flex: 1; min-height: 56px; border: 0; border-radius: 999px; background: {{pBg}}; color: {{pInk}}; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer\">{{pLabel}}<\/button>\n  <\/div>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.TEAMS = ['البوطيف', 'الفرسان', 'الزللي', 'حي الرضا', 'البونافع', 'شباب الوردية', 'الزريجة', 'الساده', 'البوعرنوس', 'الاسواق'];\n    this.name = '';\n    this.state = { step: 1, fmt: 'groups', sel: this.TEAMS.slice(), groupsN: 2, order: [], drawn: 0, rounds: [], saved: false };\n  }\n  componentWillUnmount() { clearInterval(this.timer); }\n  shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = b[i]; b[i] = b[j]; b[j] = t; } return b; }\n  league(teams) {\n    const t = teams.slice(); if (t.length % 2) t.push(null);\n    const n = t.length, rounds = [];\n    for (let r = 0; r < n - 1; r++) {\n      const ms = [];\n      for (let i = 0; i < n / 2; i++) { const a = t[i], b = t[n - 1 - i]; if (a && b) ms.push(r % 2 ? { a: b, b: a } : { a, b }); }\n      rounds.push({ name: 'الجولة ' + (r + 1), matches: ms });\n      t.splice(1, 0, t.pop());\n    }\n    return rounds;\n  }\n  knockout(teams) {\n    const t = this.shuffle(teams), ms = [];\n    for (let i = 0; i < t.length; i += 2) ms.push({ a: t[i], b: t[i + 1] || 'يتأهل مباشرة' });\n    const n = t.length;\n    const nm = n > 8 ? 'دور الـ16' : n > 4 ? 'ربع النهائي' : 'نصف النهائي';\n    return [{ name: nm, matches: ms }];\n  }\n  run() {\n    const s = this.state;\n    if (s.fmt === 'groups') {\n      const order = this.shuffle(s.sel);\n      this.setState({ step: 3, order, drawn: 0, rounds: [], saved: false });\n      clearInterval(this.timer);\n      this.timer = setInterval(() => {\n        const d = this.state.drawn + 1;\n        this.setState({ drawn: d });\n        if (d >= order.length) clearInterval(this.timer);\n      }, 450);\n    } else {\n      const rounds = s.fmt === 'league' ? this.league(this.shuffle(s.sel)) : this.knockout(s.sel);\n      this.setState({ step: 3, rounds, saved: false });\n    }\n  }\n  save() {\n    const s = this.state, st = window.MStore;\n    const name = (this.name || '').trim() || 'بطولة جديدة';\n    if (st) {\n      const cups = st.get('cups', []);\n      const G = ['أ', 'ب', 'ج', 'د'];\n      const groups = s.fmt === 'groups' ? Array.from({ length: s.groupsN }, (_, gi) => ({ name: 'المجموعة ' + G[gi], teams: s.order.filter((_, i) => i % s.groupsN === gi) })) : [];\n      cups.push({ id: Date.now(), name, fmt: s.fmt, teams: s.sel.slice(), groups, rounds: s.rounds });\n      st.set('cups', cups);\n      const notes = st.get('notes', []);\n      const now = new Date();\n      const what = s.fmt === 'groups' ? 'ظهرت قرعة ' : 'صدر جدول مباريات ';\n      notes.unshift({ id: now.getTime(), text: what + name + '. افتحوا صفحة البطولات لمشاهدتها.', aud: 'all', audLabel: 'الجميع', at: now.toISOString() });\n      st.set('notes', notes);\n    }\n    this.setState({ saved: true });\n  }\n  renderVals() {\n    const s = this.state;\n    const F = [\n      { id: 'league', label: 'دوري', desc: 'كل فريق يلعب ضد الكل، والترتيب بالنقاط ثم فارق الأهداف' },\n      { id: 'ko', label: 'خروج المغلوب', desc: 'قرعة أزواج عشوائية، والفائز يتأهل حتى النهائي' },\n      { id: 'groups', label: 'كأس بالمجموعات', desc: 'قرعة على مجموعات، ثم ربع ونصف ونهائي' }\n    ];\n    const formats = F.map((f) => ({ ...f, sel: f.id === s.fmt ? 'true' : 'false', bg: f.id === s.fmt ? '#D8B45C' : '#142019', ink: f.id === s.fmt ? '#1A1405' : '#ECF1EA', pick: () => this.setState({ fmt: f.id }) }));\n    const teamList = this.TEAMS.map((name) => {\n      const on = s.sel.indexOf(name) >= 0;\n      return { name, sel: on ? 'true' : 'false', bg: on ? '#1F3326' : '#142019', ink: on ? '#ECF1EA' : '#7F9386', box: on ? '#D8B45C' : '#3B5244', fill: on ? '#D8B45C' : 'transparent',\n        toggle: () => this.setState({ sel: on ? s.sel.filter((x) => x !== name) : this.TEAMS.filter((x) => x === name || s.sel.indexOf(x) >= 0) }) };\n    });\n    const maxG = Math.max(2, Math.min(4, Math.floor(s.sel.length / 2)));\n    const G = ['أ', 'ب', 'ج', 'د'];\n    const per = Math.ceil(s.order.length / s.groupsN) || 1;\n    const groups = Array.from({ length: s.groupsN }, (_, gi) => ({\n      name: 'المجموعة ' + G[gi],\n      slots: Array.from({ length: per }, (_, k) => {\n        const idx = k * s.groupsN + gi;\n        const team = idx < s.drawn ? s.order[idx] : '';\n        const isNew = idx === s.drawn - 1;\n        return { team, filled: !!team, empty: !team, bg: isNew ? '#D8B45C' : (team ? '#1B2A21' : '#101C15'), ink: isNew ? '#1A1405' : (team ? '#ECF1EA' : '#5E7266') };\n      })\n    }));\n    const tooFew = s.sel.length < 4;\n    const drawing = s.step === 3 && s.fmt === 'groups' && s.drawn < s.order.length;\n    let pLabel = 'التالي: اختيار الفرق', primary = () => this.setState({ step: 2 });\n    if (s.step === 2) { pLabel = s.fmt === 'groups' ? 'إجراء القرعة' : s.fmt === 'league' ? 'توليد جدول الدوري' : 'إجراء قرعة الأزواج'; primary = () => { if (!tooFew) this.run(); }; }\n    if (s.step === 3) {\n      if (drawing) { pLabel = 'جارٍ السحب...'; primary = () => {}; }\n      else if (s.saved) { pLabel = 'عرض البطولات'; primary = () => { if (window.MStore) window.MStore.go('Tournaments'); }; }\n      else { pLabel = 'حفظ ونشر البطولة'; primary = () => this.save(); }\n    }\n    const disabled = (s.step === 2 && tooFew) || drawing;\n    const FL = { league: 'دوري', ko: 'خروج المغلوب', groups: 'كأس بالمجموعات' };\n    return {\n      steps: [1, 2, 3].map((n) => ({ bg: n <= s.step ? '#D8B45C' : '#1B2A21' })),\n      stepLabel: ['', 'الخطوة 1: الاسم والنظام', 'الخطوة 2: اختيار الفرق', s.fmt === 'groups' ? 'الخطوة 3: القرعة' : 'الخطوة 3: جدول المباريات'][s.step],\n      s1: s.step === 1, s2: s.step === 2, s3: s.step === 3,\n      formats, teamList, selCount: s.sel.length,\n      allLabel: s.sel.length === this.TEAMS.length ? 'إلغاء الكل' : 'تحديد الكل',\n      toggleAll: () => this.setState({ sel: s.sel.length === this.TEAMS.length ? [] : this.TEAMS.slice() }),\n      isGroups: s.fmt === 'groups', groupsN: s.groupsN,\n      gMinus: () => this.setState({ groupsN: Math.max(2, s.groupsN - 1) }),\n      gPlus: () => this.setState({ groupsN: Math.min(maxG, s.groupsN + 1) }),\n      tooFew,\n      nameVal: this.name,\n      cupName: (this.name || '').trim() || 'بطولة جديدة', fmtLabel: FL[s.fmt],\n      showGroups: s.step === 3 && s.fmt === 'groups', groups,\n      showRounds: s.step === 3 && s.fmt !== 'groups', rounds: s.rounds,\n      saved: s.saved,\n      showPrev: s.step > 1 && !s.saved && !drawing,\n      prev: () => { clearInterval(this.timer); this.setState({ step: s.step - 1, saved: false }); },\n      primary, pLabel,\n      pBg: disabled ? '#1B2A21' : '#D8B45C', pInk: disabled ? '#7F9386' : '#1A1405',\n      setName: (e) => { this.name = e && e.target ? e.target.value : ''; },\n      back: () => { try { window.history.back(); } catch (e) {} }\n    };\n  }\n}\n"}]</script>
