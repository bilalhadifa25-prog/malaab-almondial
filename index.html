<script type="application/json" id="screens">[{"name": "Main", "w": 390, "h": 844, "fill": false, "css": "\nbody{margin:0;background:#0D1712}\na{color:#D8B45C}a:hover{color:#E9CB80}\n.p{transition:transform 160ms cubic-bezier(.23,1,.32,1)}\n.p:active{transform:scale(.97)}\n@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}\n.in{animation:rise 460ms cubic-bezier(.23,1,.32,1) both}\n.d1{animation-delay:70ms}.d2{animation-delay:140ms}.d3{animation-delay:210ms}.d4{animation-delay:280ms}\n@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}\n.live{animation:pulse 1.6s ease-in-out infinite}\n.sc::-webkit-scrollbar{display:none}\n@media (prefers-reduced-motion:reduce){.in,.live{animation:none}.p{transition:none}}\n", "tpl": "\n<div dir=\"rtl\" style=\"width: 390px; height: 844px; background: #0D1712; color: #ECF1EA; font-family: 'Readex Pro', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden\">\n\n  <header style=\"display: flex; align-items: center; gap: 12px; padding: 20px 20px 12px\">\n    <div style=\"width: 44px; height: 44px; border-radius: 50%; background: #D8B45C; color: #1A1405; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700\">شعار<\/div>\n    <div style=\"flex: 1; display: flex; flex-direction: column; gap: 2px\">\n      <span style=\"font-size: 19px; font-weight: 700; letter-spacing: -0.01em\">ملعب المونديال<\/span>\n      <span style=\"font-size: 13px; color: #A3B5A8\">الجمعة 6 تشرين الثاني<\/span>\n    <\/div>\n    <button class=\"p\" aria-label=\"الإشعارات\" style=\"width: 44px; height: 44px; border-radius: 50%; border: 0; background: #1B2A21; color: #ECF1EA; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer\">\n      <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><p .dc.html\" style=\"flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 6px; color: #A3B5A8; text-decoration: none; font-size: 11px\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"4\"><\/circle><path d=\"M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6\"><\/path><\/svg>حسابي<\/a>\n  <\/nav>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  renderVals() {\n    const tag = (kind) => {\n      if (kind === 'live') return { tagBg: '#1F4A31', tagInk: '#8FE0A8' };\n      if (kind === 'fixed') return { tagBg: '#2A2A1A', tagInk: '#E2C677' };\n      if (kind === 'cup') return { tagBg: '#1E2E45', tagInk: '#A9C4F0' };\n      if (kind === 'free') return { tagBg: '#1B2A21', tagInk: '#A3B5A8' };\n      return { tagBg: '#1B2A21', tagInk: '#C9D6CC' };\n    };\n    const raw = [\n      { time: '6:00', teams: 'الصقور × الرافدين', tag: 'مباشر', kind: 'live' },\n      { time: '7:00', teams: 'الكرامة × الفرات', tag: 'دوري المونديال', kind: 'cup' },\n      { time: '9:00', teams: 'الجزيرة × الأحرار', tag: 'دوري المونديال', kind: 'cup' },\n      { time: '10:00', teams: 'النسور × الشروق', tag: 'كأس الشتاء', kind: 'cup' }\n    ];\n    const games = raw.map((g) => ({\n      ...g, ...tag(g.kind),\n      timeColor: g.kind === 'live' ? '#8FE0A8' : '#ECF1EA',\n      textColor: g.kind === 'free' ? '#7F9386' : '#ECF1EA'\n    }));\n    return {\n      games,\n      table: [\n        { pos: 1, name: 'الصقور', gd: '+9', pts: 12 },\n        { pos: 2, name: 'شباب الوردية', gd: '+6', pts: 10 },\n        { pos: 3, name: 'الرافدين', gd: '+2', pts: 7 },\n        { pos: 4, name: 'الكرامة', gd: '0', pts: 6 }\n      ],\n      scorers: [\n        { name: 'علي جبار', team: 'الصقور', goals: 9 },\n        { name: 'كرار عباس', team: 'شباب الوردية', goals: 7 },\n        { name: 'مصطفى حيدر', team: 'الرافدين', goals: 6 },\n        { name: 'حسين كاظم', team: 'الكرامة', goals: 5 }\n      ]\n    };\n  }\n}\n"}, {"name": "Login", "w": 390, "h": 844, "fill": false, "css": "\nbody{margin:0;background:#0D1712}\na{color:#D8B45C}a:hover{color:#E9CB80}\n.p{transition:transform 160ms cubic-bezier(.23,1,.32,1)}\n.p:active{transform:scale(.97)}\n@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}\n.in{animation:rise 360ms cubic-bezier(.23,1,.32,1) both}\ninput::placeholder{color:#7F9386}\ninput:focus{outline:2px solid #D8B45C;outline-offset:2px}\n@media (prefers-reduced-motion:reduce){.in{animation:none}.p{transition:none}}\n", "tpl": "\n<div dir=\"rtl\" style=\"width: 390px; height: 844px; background: #0D1712; color: #ECF1EA; font-family: 'Readex Pro', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative\">\n\n  <svg width=\"390\" height=\"420\" viewBox=\"0 0 390 420\" fill=\"none\" stroke=\"#ECF1EA\" stroke-opacity=\"0.07\" stroke-width=\"2\" style=\"position: absolute; top: 0; left: 0\" aria-hidden=\"true\"><rect x=\"-20\" y=\"-20\" width=\"430\" height=\"420\"><\/rect><path d=\"M-20 200h430\"><\/path><circle cx=\"195\" cy=\"200\" r=\"78\"><\/circle><circle cx=\"195\" cy=\"200\" r=\"3\" fill=\"#ECF1EA\" fill-opacity=\"0.12\"><\/circle><rect x=\"95\" y=\"-20\" width=\"200\" height=\"90\"><\/rect><\/svg>\n\n  <div style=\"position: relative; padding: 60px 28px 0; display: flex; flex-direction: column; align-items: center; gap: 14px\">\n    <div style=\"width: 96px; height: 96px; border-radius: 50%; background: #D8B45C; color: #1A1405; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700\">شعار الملعب<\/div>\n    <h1 style=\"margin: 6px 0 0; font-size: 34px; font-weight: 700; letter-spacing: -0.02em\">ملعب المونديال<\/h1>\n    <p style=\"margin: 0; font-size: 16px; color: #A3B5A8; text-align: center; line-height: 1.5\">البطولات والنتائج والهدافون. كلها في جيبك.<\/p>\ structor(props) { super(props); this.state = { follow: false, vote: -1 }; }\n  renderVals() {\n    const base = [['علي جبار', 'الصقور', 64], ['مصطفى حيدر', 'الرافدين', 21], ['سجاد ناصر', 'الرافدين', 15]];\n    const votes = base.map((c, i) => c[2] + (this.state.vote === i ? 1 : 0));\n    const total = votes.reduce((a, b) => a + b, 0);\n    const voted = this.state.vote >= 0;\n    const cands = base.map((c, i) => ({\n      name: c[0], team: c[1], mine: this.state.vote === i ? 'true' : 'false',\n      pct: Math.round(votes[i] * 100 / total) + '%',\n      w: voted ? Math.round(votes[i] * 100 / total) + '%' : '0%',\n      fill: this.state.vote === i ? '#5C4A1E' : '#26382D',\n      vote: () => this.setState({ vote: i })\n    }));\n    const ev = [\n      { min: 12, player: 'علي جبار', t: 'a', kind: 'goal' },\n      { min: 16, player: 'كرار حسن', t: 'b', kind: 'yellow' },\n      { min: 19, player: 'مصطفى حيدر', t: 'b', kind: 'goal' },\n      { min: 24, player: 'عباس فاضل', t: 'a', kind: 'yellow' },\n      { min: 27, player: 'علي جبار', t: 'a', kind: 'goal' }\n    ].reverse();\n    const events = ev.map((e, i) => ({\n      ...e, delay: (i * 60) + 'ms',\n      dir: e.t === 'a' ? 'row' : 'row-reverse',\n      goal: e.kind === 'goal', card: e.kind !== 'goal',\n      cardColor: e.kind === 'red' ? '#E05A4E' : '#E8C547',\n      cardLabel: e.kind === 'red' ? 'بطاقة حمراء' : 'بطاقة صفراء'\n    }));\n    const f = this.state.follow;\n    return {\n      events, cands, showPct: voted, totalVotes: total,\n      stats: [\n        { label: 'التسديدات', a: 9, b: 5 },\n        { label: 'على المرمى', a: 5, b: 2 },\n        { label: 'الأخطاء', a: 4, b: 6 }\n      ],\n      follow: f, followAria: f ? 'true' : 'false',\n      followBg: f ? '#D8B45C' : '#1B2A21', followInk: f ? '#1A1405' : '#ECF1EA',\n      toggleFollow: () => this.setState({ follow: !f })\n    };\n  }\n}\n"}, {"name": "Draw", "w": 390, "h": 844, "fill": false, "css": "\nbody{margin:0;background:#0D1712}\na{color:#D8B45C}a:ho radius: 999px; background: #1B2A21; color: #ECF1EA; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer\">{{allLabel}}<\/button>\n  <\/div>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.teams = ['الصقور','الرافدين','شباب الوردية','الكرامة','الفرات','الجزيرة','الأحرار','النجوم','النسور','أبطال الحلة','الشموس','الأصدقاء','البركان','الشروق','الوفاء','الأمل'];\n    this.state = { drawn: [], last: -1 };\n  }\n  componentWillUnmount() { if (this.timer) clearInterval(this.timer); }\n  pickNext(drawn) {\n    const left = this.teams.filter((t) => drawn.indexOf(t) < 0);\n    if (!left.length) return drawn;\n    return drawn.concat([left[Math.floor(Math.random() * left.length)]]);\n  }\n  renderVals() {\n    const drawn = this.state.drawn;\n    const n = drawn.length;\n    const gNames = ['المجموعة أ', 'المجموعة ب', 'المجموعة ج', 'المجموعة د'];\n    const groups = gNames.map((name, gi) => ({\n      name,\n      slots: [0, 1, 2, 3].map((k) => {\n        const idx = k * 4 + gi;\n        const team = drawn[idx];\n        const isNew = idx === n - 1;\n        return { team: team || '', filled: !!team, empty: !team,\n          bg: isNew ? '#D8B45C' : (team ? '#1B2A21' : '#101C15'),\n          ink: isNew ? '#1A1405' : (team ? '#ECF1EA' : '#5E7266') };\n      })\n    }));\n    const done = n >= 16;\n    return {\n      groups,\n      idle: n === 0,\n      showEven: n > 0 && n % 2 === 0,\n      showOdd: n % 2 === 1,\n      lastTeam: drawn[n - 1] || '',\n      lastGroup: n ? gNames[(n - 1) % 4] : '',\n      done,\n      drawLabel: done ? 'اكتملت' : (n === 0 ? 'اسحب' : 'اسحب التالي'),\n      drawBg: done ? '#1B2A21' : '#D8B45C', drawInk: done ? '#7F9386' : '#1A1405',\n      allLabel: done ? 'إعادة' : 'سحب الكل',\n      drawOne: () => { if (!done) this.setState({ drawn: this.pickNext(this.state.drawn) }); },\n      drawAll: () => {\n        if (this.timer) { clearInterval(this.timer); this.timer = null cted=\"{{t.sel}}\" onClick=\"{{t.pick}}\" class=\"p\" style=\"min-height: 44px; border: 0; border-radius: 12px; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; background: {{t.bg}}; color: {{t.ink}}\">{{t.label}}<\/button>\n      <\/sc-for>\n    <\/div>\n  <\/header>\n\n  <main class=\"sc\" style=\"flex: 1; overflow-y: auto; padding: 4px 20px 28px\">\n    <sc-if value=\"{{isChamps}}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display: flex; flex-direction: column; gap: 10px\">\n        <sc-for list=\"{{champs}}\" as=\"c\" hint-placeholder-count=\"5\">\n          <div class=\"in\" style=\"display: flex; align-items: center; gap: 16px; border-radius: 20px; padding: 16px; background: {{c.bg}}; color: {{c.ink}}; animation-delay: {{c.delay}}\">\n            <svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 4h8v5a4 4 0 0 1-8 0zM8 6H4.5a3.5 3.5 0 0 0 3.6 4M16 6h3.5a3.5 3.5 0 0 1-3.6 4M12 13v4M9 21h6M10 17h4v4h-4z\"><\/path><\/svg>\n            <div style=\"flex: 1; display: flex; flex-direction: column; gap: 3px\">\n              <span style=\"font-size: 18px; font-weight: 700\">{{c.team}}<\/span>\n              <span style=\"font-size: 13px; opacity: 0.85\">{{c.cup}}<\/span>\n            <\/div>\n            <span style=\"font-size: 14px; font-weight: 600; opacity: 0.85\">{{c.when}}<\/span>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n    <\/sc-if>\n\n    <sc-if value=\"{{isRecords}}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px\">\n        <sc-for list=\"{{records}}\" as=\"r\" hint-placeholder-count=\"6\">\n          <div class=\"in\" style=\"background: #142019; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 8px; grid-column: {{r.span}}; animation-delay:  + 'ms' }));\n    return { tabs, champs, records, isChamps: tab === 'champs', isRecords: tab === 'records' };\n  }\n}\n"}, {"name": "Admin", "w": 390, "h": 844, "fill": false, "css": "\nbody{margin:0;background:#0D1712}\na{color:#D8B45C}a:hover{color:#E9CB80}\n.p{transition:transform 160ms cubic-bezier(.23,1,.32,1)}\n.p:active{transform:scale(.97)}\n@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}\n.in{animation:rise 320ms cubic-bezier(.23,1,.32,1) both}\n@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}\n.sheet{animation:sheet 340ms cubic-bezier(.32,.72,0,1) both}\n@keyframes fade{from{opacity:0}to{opacity:1}}\n.scrim{animation:fade 240ms ease both}\n.sc::-webkit-scrollbar{display:none}\ninput::placeholder,textarea::placeholder{color:#7F9386}\ninput:focus,textarea:focus{outline:2px solid #D8B45C;outline-offset:2px}\n@media (prefers-reduced-motion:reduce){.in,.sheet,.scrim{animation:none}.p{transition:none}}\n", "tpl": "\n<div dir=\"rtl\" style=\"width: 390px; height: 844px; background: #0D1712; color: #ECF1EA; font-family: 'Readex Pro', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative\">\n\n  <header style=\"display: flex; align-items: center; gap: 12px; padding: 20px 20px 10px\">\n    <div style=\"width: 44px; height: 44px; border-radius: 50%; background: #D8B45C; color: #1A1405; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700\">شعار<\/div>\n    <div style=\"flex: 1; display: flex; flex-direction: column; gap: 2px\">\n      <span style=\"font-size: 20px; font-weight: 700\">لوحة الإدارة<\/span>\n      <span style=\"font-size: 13px; color: #A3B5A8\">مرحباً، مدير الملعب<\/span>\n    <\/div>\n    <a href=\"Login.dc.html\" style=\"font-size: 14px; text-decoration: none; padding: 12px 4px; color: #A3B5A8\">خروج<\/a>\n  <\/header>\n\n  <main class=\"sc\" style=\"flex: 1; overflow-y: auto; padding: 6px 20px 28px; displa \">بطولة جديدة<\/h2>\n      <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600\">اسم البطولة\n        <input type=\"text\" placeholder=\"مثلاً: كأس الربيع\" style=\"min-height: 50px; border: 0; border-radius: 14px; background: #1B2A21; color: #ECF1EA; font-family: inherit; font-size: 16px; padding: 0 16px\">\n      <\/label>\n      <div style=\"display: flex; flex-direction: column; gap: 6px\">\n        <sc-for list=\"{{formats}}\" as=\"f\" hint-placeholder-count=\"3\">\n          <button onClick=\"{{f.pick}}\" aria-pressed=\"{{f.sel}}\" class=\"p\" style=\"border: 0; border-radius: 16px; padding: 12px 14px; font-family: inherit; text-align: right; cursor: pointer; display: flex; flex-direction: column; gap: 2px; background: {{f.bg}}; color: {{f.ink}}\">\n            <span style=\"font-size: 15px; font-weight: 700\">{{f.label}}<\/span>\n            <span style=\"font-size: 12px; opacity: 0.85\">{{f.desc}}<\/span>\n          <\/button>\n        <\/sc-for>\n      <\/div>\n      <div style=\"display: flex; align-items: center; justify-content: space-between\">\n        <span style=\"font-size: 15px; font-weight: 600\">عدد الفرق<\/span>\n        <div style=\"display: flex; align-items: center; gap: 6px\">\n          <button onClick=\"{{minus}}\" aria-label=\"أقل\" class=\"p\" style=\"width: 44px; height: 44px; border: 0; border-radius: 12px; background: #1B2A21; color: #ECF1EA; font-size: 22px; cursor: pointer\">−<\/button>\n          <span style=\"width: 40px; text-align: center; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums\">{{teams}}<\/span>\n          <button onClick=\"{{plus}}\" aria-label=\"أكثر\" class=\"p\" style=\"width: 44px; height: 44px; border: 0; border-radius: 12px; background: #1B2A21; color: #ECF1EA; font-size: 22px; cursor: pointer\">+<\/button>\n        <\/div>\n      <\/div>\n      <button onClick=\"{{create}}\" class=\"p\" style=\"min-height: 54px; border: 0; border-radius: 999px; background: #D8B45C; color: #1A1405; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer\">إنشاء وتوليد الجدول تلقائياً<\/button>\n    <\/div>\n  <\/sc-if>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { aud: 'all', msg: 'بدأت الآن مباراة الصقور والرافدين. تابعوا النتيجة مباشرة.', toast: '', sheet: false, fmt: 'groups', teams: 16 };\n  }\n  flash(text) { this.setState({ toast: text }); setTimeout(() => this.setState({ toast: '' }), 2600); }\n  renderVals() {\n    const s = this.state;\n    const A = [{ id: 'all', label: 'الجميع' }, { id: 'caps', label: 'الكباتن' }, { id: 'team', label: 'فريق محدد' }, { id: 'cup', label: 'فرق بطولة' }];\n    const audiences = A.map((a) => ({ ...a, sel: a.id === s.aud ? 'true' : 'false', bg: a.id === s.aud ? '#ECF1EA' : '#1B2A21', ink: a.id === s.aud ? '#0D1712' : '#A3B5A8', pick: () => this.setState({ aud: a.id }) }));\n    const T = [\n      { label: 'بدأت المباراة', msg: 'بدأت الآن مباراة الصقور والرافدين. تابعوا النتيجة مباشرة.' },\n      { label: 'هدف', msg: 'هدف للصقور! علي جبار يسجّل في الدقيقة 27.' },\n      { label: 'نتيجة القرعة', msg: 'ظهرت قرعة كأس الشتاء. شاهدوا مجموعتكم الآن.' },\n      { label: 'تغيير موعد', msg: 'تنبيه: تأجّلت مباراة الساعة 9 إلى الساعة 10 مساءً.' }\n    ];\n    const templates = T.map((t) => ({ label: t.label, pick: () => this.setState({ msg: t.msg }) }));\n    const audLabel = (A.find((a) => a.id === s.aud) || A[0]).label;\n    const F = [\n      { id: 'league', label: 'دوري', desc: 'الكل يلعب ضد الكل، والترتيب بالنقاط' },\n      { id: 'ko', label: 'خروج المغلوب', desc: 'شجرة إقصاء مع ركلات ترجيح عند التعادل' },\n      { id: 'groups', label: 'كأس بالمجموعات', desc: 'مجموعات ثم ربع ونصف ونهائي' }\n    ];\n    const formats = F.map((f) => ({ ...f, sel: f.id === s.fmt ? 'true' : 'false', bg: f.id === s.fmt ? '#D8B45C' : '#1B2A21', ink: f.id === s.fmt ? '#1A1405' : '#ECF1EA', pick: () => this.setState({ fmt: ump\" style=\"font-size: 46px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; display: inline-block\">{{sa}} – {{sb}}<\/span><\/sc-if>\n    <span style=\"font-size: 16px; font-weight: 700; text-align: center\">{{teamB}}<\/span>\n  <\/div>\n\n  <div role=\"radiogroup\" aria-label=\"نوع الحدث\" style=\"margin: 10px 20px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px\">\n    <sc-for list=\"{{modes}}\" as=\"m\" hint-placeholder-count=\"3\">\n      <button role=\"radio\" aria-checked=\"{{m.sel}}\" onClick=\"{{m.pick}}\" class=\"p\" style=\"min-height: 50px; border: 0; border-radius: 16px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; background: {{m.bg}}; color: {{m.ink}}\">\n        <span style=\"width: 12px; height: 16px; border-radius: 2px; background: {{m.chip}}\"><\/span>{{m.label}}\n      <\/button>\n    <\/sc-for>\n  <\/div>\n  <p style=\"margin: 8px 20px 0; font-size: 13px; color: #A3B5A8\">اختر الحدث (هدف، إنذار، طرد) ثم اضغط اسم اللاعب.<\/p>\n\n  <div style=\"margin: 8px 20px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px\">\n    <sc-for list=\"{{sides}}\" as=\"sd\" hint-placeholder-count=\"2\">\n      <div style=\"display: flex; flex-direction: column; gap: 6px\">\n        <sc-for list=\"{{sd.players}}\" as=\"pl\" hint-placeholder-count=\"5\">\n          <button onClick=\"{{pl.tap}}\" disabled=\"{{pl.off}}\" class=\"p\" style=\"min-height: 44px; border: 0; border-radius: 14px; padding: 0 10px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 6px; background: {{pl.bg}}; color: {{pl.ink}}\">\n            <span style=\"white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{pl.num}} · {{pl.name}}<\/span>\n            <span style=\"display: flex; gap: 3px; align-items: center\">\n              <sc-if value=\"{{pl.hasGoals}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size: 12px; color: #8FE0A8; font-variant-numeric: tabular-nums\">{{pl.goals}}×<\/span><\/sc-if>\n              <sc-if value=\"{{pl.y1}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width: 9px; height: 13px; border-radius: 2px; background: #E8C547\"><\/span><\/sc-if>\n              <sc-if value=\"{{pl.y2}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width: 9px; height: 13px; border-radius: 2px; background: #E8C547\"><\/span><\/sc-if>\n              <sc-if value=\"{{pl.r}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width: 9px; height: 13px; border-radius: 2px; background: #E05A4E\"><\/span><\/sc-if>\n            <\/span>\n          <\/button>\n        <\/sc-for>\n      <\/div>\n    <\/sc-for>\n  <\/div>\n\n  <div class=\"sc\" style=\"flex: 1; overflow-y: auto; margin: 10px 20px 0; display: flex; flex-direction: column; gap: 6px\">\n    <sc-if value=\"{{hasAlert}}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"in\" role=\"status\" style=\"background: #3A1E1B; color: #F6C9C3; border-radius: 14px; padding: 10px 12px; font-size: 13px; font-weight: 600\">{{alert}}<\/div>\n    <\/sc-if>\n    <sc-for list=\"{{log}}\" as=\"e\" hint-placeholder-count=\"2\">\n      <div class=\"in\" style=\"font-size: 13px; color: #C9D6CC; background: #142019; border-radius: 12px; padding: 9px 12px\">{{e}}<\/div>\n    <\/sc-for>\n  <\/div>\n\n  <div style=\"padding: 10px 20px 22px; display: flex; gap: 8px\">\n    <button onClick=\"{{undo}}\" class=\"p\" style=\"min-height: 54px; padding: 0 18px; border: 0; border-radius: 999px; background: #1B2A21; color: #ECF1EA; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer\">تراجع<\/button>\n    <button onClick=\"{{finish}}\" class=\"p\" style=\"flex: 1; min-height: 54px; border: 0; border-radius: 999px; background: {{finishBg}}; color: {{finishInk}}; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer\">{{finishLabel}}<\/button>\n  <\/div>\n<\/div>\n", "logic": "\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.rosters = {\n      'الصقور': [['10','علي جبار'],['7','عباس فاضل'],['4','حسين علي'],['9','أحمد كريم'],['1','زيد مهدي']],\n      'الرافدين': [['11','مصطفى حيدر'],['8','كرار حسن'],['5','حيدر عادل'],['6','منتظر جواد'],['1','سجاد ناصر']],\n      'الكرامة': [['9','حسين كاظم'],['7','سيف كريم'],['5','محمد رضا'],['3','باقر حسن'],['1','علي فارس']],\n      'الفرات': [['10','حيدر سلام'],['8','مهدي صالح'],['4','رسول كاظم'],['6','أمير علي'],['1','جعفر حسين']],\n      'الجزيرة': [['9','ليث فاضل'],['7','علي رزاق'],['5','حسن مجيد'],['3','نور الدين'],['1','عمار جاسم']],\n      'الأحرار': [['10','سيف علي'],['8','مرتضى حسن'],['6','كرار ناصر'],['4','حمزة علي'],['1','يوسف سالم']]\n    };\n    this.list = [\n      { id: 'm1', a: 'الصقور', b: 'الرافدين', time: '6:00' },\n      { id: 'm2', a: 'الكرامة', b: 'الفرات', time: '7:00' },\n      { id: 'm3', a: 'الجزيرة', b: 'الأحرار', time: '9:00' }\n    ];\n    this.state = { cur: 'm1', mode: 'goal', events: { m1: [], m2: [], m3: [] }, done: {} };\n  }\n  renderVals() {\n    const s = this.state;\n    const m = this.list.find((x) => x.id === s.cur);\n    const ev = s.events[s.cur];\n    const done = !!s.done[s.cur];\n    const count = (t, name, kind) => ev.filter((e) => e.t === t && e.name === name && e.kind === kind).length;\n    const sa = ev.filter((e) => e.t === 'a' && e.kind === 'goal').length;\n    const sb = ev.filter((e) => e.t === 'b' && e.kind === 'goal').length;\n    const matches = this.list.map((x) => {\n      const sel = x.id === s.cur;\n      const st = s.done[x.id] ? 'انتهت' : (s.events[x.id].length ? 'جارية' : 'لم تبدأ');\n      return { label: x.a + ' × ' + x.b, time: x.time, status: st, sel: sel ? 'true' : 'false', bg: sel ? '#D8B45C' : '#142019', ink: sel ? '#1A1405' : '#ECF1EA', pick: () => this.setState({ cur: x.id }) };\n    });\n    const M = [\n      { id: 'goal', label: 'هدف', chip: '#6FCF8E' },\n      { id: 'yellow', label: 'إنذار', chip: '#E8C547' },\n      { id: 'red', label: 'طرد', chip: '#E05A4E' }\n    ];\n    const modes = M.map((x) => ({ ...x, sel: x.id === s.mode ? 'true' : 'false', bg: x.id === s.mode ? '#ECF1EA' : '#142019', ink: x.id === s.mode ? '#0D1712' : '#ECF1EA', pick: () => this.setState({ mode: x.id }) }));\n    let alert = '';\n    const side = (t, team) => ({\n      players: this.rosters[team].map((p) => {\n        const name = p[1];\n        const g = count(t, name, 'goal'), y = count(t, name, 'yellow'), r = count(t, name, 'red');\n        const sentOff = r > 0 || y >= 2;\n        if (y >= 2) alert = name + ': إنذار ثانٍ = طرد، وإيقاف تلقائي للمباراة القادمة';\n        else if (r > 0) alert = name + ': طرد مباشر، وإيقاف تلقائي لمباراتين';\n        return {\n          num: p[0], name, goals: g, hasGoals: g > 0, y1: y >= 1, y2: y >= 2, r: r > 0,\n          off: sentOff || done,\n          bg: sentOff ? '#2A1A18' : (t === 'a' ? '#1E3A2A' : '#1E2A42'),\n          ink: sentOff ? '#9C7C77' : '#ECF1EA',\n          tap: () => {\n            if (sentOff || done) return;\n            const list = this.state.events[this.state.cur];\n            const next = list.concat([{ t, name, kind: this.state.mode, min: 3 + list.length * 4 }]);\n            this.setState({ events: { ...this.state.events, [this.state.cur]: next } });\n          }\n        };\n      })\n    });\n    const kindTxt = { goal: 'هدف', yellow: 'إنذار', red: 'طرد' };\n    const log = ev.slice().reverse().map((e) => e.min + '′  ' + kindTxt[e.kind] + ' — ' + e.name);\n    return {\n      matches, teamA: m.a, teamB: m.b, sa, sb, even: ev.length % 2 === 0, odd: ev.length % 2 === 1,\n      modes, sides: [side('a', m.a), side('b', m.b)],\n      log, alert, hasAlert: !!alert,\n      undo: () => { if (done) { this.setState({ done: { ...s.done, [s.cur]: false } }); return; } this.setState({ events: { ...s.events, [s.cur]: ev.slice(0, -1) } }); },\n      finish: () => this.setState({ done: { ...s.done, [s.cur]: true } }),\n      finishLabel: done ? 'اعتُمدت النتيجة · تحدّث الترتيب' : 'إنهاء المباراة واعتماد النتيجة',\n      finishBg: done ? '#1F4A31' : '#D8B45C', finishInk: done ? '#DDF5E4' : '#1A1405'\n    };\n  }\n}\n"}, {"name": "Team", "w": 390, "h": 844, "fill": false, "css": "\nbody{margin:0;background:#0D1712}\na{color:#D8B45C}a:hover{color:#E9CB80}\n.p{transition:transform 160ms cubic-bezier(.23,1,.32,1)}\n.p:active{transform:scale(.97)}\n@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}\n.in{animation:rise 340ms cubic-bezier(.23,1,.32,1) both}\n@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}\n.sheet{animation:sheet 340ms cubic-bezier(.32,.72,0,1) both}\n@keyframes fade{from{opacity:0}to{opacity:1}}\n.scrim{animation:fade 240ms ease both}\n.sc::-webkit-scrollbar{display:none}\ninput::placeholder{color:#7F9386}\ninput:focus{outline:2px solid #D8B45C;outline-offset:2px}\n@media (prefers-reduced-motion:reduce){.in,.sheet,.scrim{animation:none}.p{transition:none}}\n", "tpl": "\n<div dir=\"rtl\" style=\"width: 390px; height: 844px; background: #0D1712; color: #ECF1EA; font-family: 'Readex Pro', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative\">\n\n  <div style=\"background: {{teamColor}}; transition: background-color 300ms ease; border-radius: 0 0 32px 32px; padding: 18px 20px 22px; display: flex; flex-direction: column; gap: 18px\">\n    <div style=\"display: flex; align-items: center; justify-content: space-between\">\n      <span style=\"font-size: 14px; color: #C3D2C7\">حساب الكابتن<\/span>\n      <div style=\"display: flex; align-items: center; gap: 12px\"><a href=\"About.dc.html\" aria-label=\"عن الملعب\" class=\"p\" style=\"width: 40px; height: 40px; border-radius: 50%; display: block; flex: 0 0 auto\"><img src=\"data:image/webp;base64,UklGRtAtAABXRUJQV الهدافون' }]\n      .map((t) => ({ ...t, sel: t.id === tab ? 'true' : 'false', bg: t.id === tab ? '#ECF1EA' : '#142019', ink: t.id === tab ? '#0D1712' : '#A3B5A8', pick: () => this.setState({ tab: t.id }) }));\n    const L = [['الصقور',5,4,0,1,9],['شباب الوردية',5,3,1,1,6],['الرافدين',5,2,1,2,2],['الكرامة',5,2,0,3,0],['الفرات',5,1,2,2,-2],['الجزيرة',5,1,1,3,-4],['الأحرار',5,1,1,3,-5],['النجوم',5,1,0,4,-6]];\n    const league = L.map((r, i) => ({ pos: i + 1, name: r[0], p: r[1], w: r[2], d: r[3], l: r[4], gd: r[5] > 0 ? '+' + r[5] : String(r[5]), pts: r[2] * 3 + r[3], posInk: i === 0 ? '#D8B45C' : '#A3B5A8' }));\n    const results = [\n      { when: 'الخميس 5 ت2', teams: 'الصقور × النجوم', score: '3–1' },\n      { when: 'الخميس 5 ت2', teams: 'الكرامة × الجزيرة', score: '2–2' },\n      { when: 'الأربعاء 4 ت2', teams: 'شباب الوردية × الأحرار', score: '4–0' },\n      { when: 'الأربعاء 4 ت2', teams: 'الرافدين × الفرات', score: '1–0' }\n    ].map((m) => ({ ...m, ink: '#ECF1EA' }));\n    const next = [\n      { when: 'اليوم 7:00', teams: 'الكرامة × الفرات', score: '—' },\n      { when: 'الخميس 8:00', teams: 'شباب الوردية × الأحرار', score: '—' },\n      { when: 'الخميس 9:00', teams: 'الجزيرة × النجوم', score: '—' }\n    ].map((m) => ({ ...m, ink: '#A3B5A8' }));\n    return {\n      tabs, league,\n      rows: tab === 'next' ? next : results,\n      scorers: [{ n: 'علي جبار', t: 'الصقور', g: 9 }, { n: 'كرار عباس', t: 'شباب الوردية', g: 7 }, { n: 'مصطفى حيدر', t: 'الرافدين', g: 6 }, { n: 'حسين كاظم', t: 'الكرامة', g: 5 }],\n      isTable: tab === 'table', isList: tab === 'results' || tab === 'next', isScorers: tab === 'scorers'\n    };\n  }\n}\n"}, {"name": "Splash", "w": 390, "h": 844, "fill": false, "css": "\nbody{margin:0;background:#0D1712}\na{color:#D8B45C}a:hover{color:#E9CB80}\n.p{transition:transform 160ms cubic-bezier(.23,1,.32,1)}\n.p:active{transform:scale(.97)}\n@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}\n.in{animation:
